# Local settings (UID, port, editor password, paths) live in .env — see .env.example.
name: h6082

services:
  h6082:
    build: .
    image: h6082:latest
    container_name: h6082
    # runs as the UID:GID owning the content/ folder (see `id`),
    # so the editor can write and the files stay yours
    user: "${H6082_UID:-1000}:${H6082_GID:-1000}"
    ports:
      # localhost only; for network access see the Security block on the h6082 page
      - "${H6082_BIND:-127.0.0.1}:${H6082_PORT:-8088}:8080"
    environment:
      H6082_EDITOR_USER: ${H6082_EDITOR_USER:-h6082}
      H6082_EDITOR_PASSWORD: ${H6082_EDITOR_PASSWORD:-}
      H6082_ALLOWED_HOSTS: ${H6082_ALLOWED_HOSTS:-}
      H6082_READONLY: ${H6082_READONLY:-}
      H6082_DEMO: ${H6082_DEMO:-}
    volumes:
      # content: writable for the web editor
      - ./content:/app/content
      # {{sys}} disk: an EMPTY directory on the host root disk (statvfs only, no data)
      - ${H6082_DISK_ROOT:-/var/empty}:/host/disk/root:ro
    # checks of services running directly on the host: http://host.docker.internal:<port>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # hardening: read-only file system (writes only to content/ and /tmp),
    # no capabilities, no privilege escalation, memory and process limits
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
