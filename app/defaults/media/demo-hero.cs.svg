<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="h6082 — noční krajina">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14121f"/>
      <stop offset=".6" stop-color="#2a1f4a"/>
      <stop offset="1" stop-color="#5b3f8f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".8" cy=".25" r=".45">
      <stop offset="0" stop-color="#c6b6ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#c6b6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="240" fill="url(#sky)"/>
  <rect width="600" height="240" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#e8e2ff">
    <circle cx="30" cy="22" r="1.3"/><circle cx="95" cy="54" r="1"/><circle cx="150" cy="18" r="1.4"/>
    <circle cx="215" cy="44" r="1"/><circle cx="270" cy="14" r="1.2"/><circle cx="330" cy="58" r="1"/>
    <circle cx="380" cy="26" r="1.3"/><circle cx="420" cy="80" r="1"/><circle cx="540" cy="30" r="1.2"/>
    <circle cx="575" cy="70" r="1"/><circle cx="250" cy="86" r="1"/><circle cx="60" cy="92" r="1"/>
  </g>
  <g fill="#e8e2ff" opacity=".5">
    <circle cx="120" cy="88" r=".8"/><circle cx="300" cy="34" r=".8"/><circle cx="355" cy="96" r=".8"/>
    <circle cx="560" cy="110" r=".8"/><circle cx="20" cy="60" r=".8"/>
  </g>

  <!-- moon -->
  <circle cx="490" cy="66" r="30" fill="#efeaff"/>
  <circle cx="502" cy="58" r="29" fill="#2a1f4a" opacity=".92"/>

  <!-- mountains -->
  <path d="M0 175 L70 128 L130 160 L205 110 L280 158 L350 122 L420 170 L500 118 L600 165 L600 240 L0 240Z" fill="#4a3878"/>
  <path d="M0 205 L60 178 L140 200 L220 165 L300 198 L380 172 L460 205 L540 180 L600 196 L600 240 L0 240Z" fill="#2c2250"/>
  <path d="M0 228 L100 212 L190 226 L290 208 L390 228 L490 210 L600 224 L600 240 L0 240Z" fill="#15121f"/>

  <!-- text -->
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
