# After a push to master, start the deploy workflows of both instances
# (h6082-deploy = private instance, h6082-deploy-demo = public read-only demo).
# Needs the secret DEPLOY_TOKEN: a token of a user with write access to both deploy repositories.
on:
  push: {branches: [master]}
jobs:
  trigger:
    runs-on: docker
    container: {image: "alpine:3.20"}
    steps:
      - name: Start the deploy workflows
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          API: ${{ forgejo.server_url }}/api/v1/repos/hindrich
        run: |
          [ -n "$TOKEN" ] || { echo "::warning::secret DEPLOY_TOKEN is missing — nothing was triggered"; exit 0; }
          apk add --no-cache curl >/dev/null
          for repo in h6082-deploy h6082-deploy-demo; do
            echo "dispatch $repo"
            curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d '{"ref":"main"}' "$API/$repo/actions/workflows/deploy.yml/dispatches"
          done
